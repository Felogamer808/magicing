# Corre las mismas tres verificaciones que se piden antes de dar algo por hecho
# (ver CLAUDE.md). Con dos personas trabajando, esto es lo que evita que un
# merge rompa los 321 casos contrastados contra la planilla original.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
